services:

  postgres:
    image: postgres:17-alpine
    container_name: sigpac-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - sigpac-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: ./backend/cultura-api
      dockerfile: Dockerfile

    container_name: sigpac-backend
    restart: unless-stopped

    env_file:
      - .env.docker

    environment:
      DB_HOST: postgres
      DB_PORT: 5432

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./uploads:/app/uploads

    networks:
      - sigpac-network


  frontend:
    build:
      context: ./frontend/cultura-web
      dockerfile: Dockerfile

    container_name: sigpac-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "80:80"

    networks:
      - sigpac-network


volumes:
  postgres_data:


networks:
  sigpac-network:
    driver: bridge
