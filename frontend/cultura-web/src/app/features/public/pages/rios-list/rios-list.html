<section>
  <h1>Ríos</h1>

  <div>
    <label for="searchRios">
      Buscar ríos
    </label>

    <input
      #searchInput
      id="searchRios"
      type="search"
      placeholder="Buscar por nombre, ubicación, descripción, reseña, cuenca, afluente..."
      [value]="search()"
      (input)="actualizarBusqueda(searchInput.value)"
    />

    <button
      type="button"
      *ngIf="search()"
      (click)="limpiarBusqueda(); searchInput.value = ''"
    >
      Limpiar
    </button>
  </div>

  <div *ngIf="cargando()">
    Cargando ríos...
  </div>

  <div *ngIf="error()">
    {{ error() }}
  </div>

  <div
    *ngIf="!cargando() && !error() && rios().length === 0"
  >
    No se encontraron ríos publicados.
  </div>

  <div *ngFor="let rio of rios()">
    <h2>
      <ng-container
        *ngFor="let segmento of segmentarCoincidencias(rio.nombre)"
      >
        <mark *ngIf="segmento.coincide">
          {{ segmento.texto }}
        </mark>

        <ng-container *ngIf="!segmento.coincide">
          {{ segmento.texto }}
        </ng-container>
      </ng-container>
    </h2>

    <p>
      <ng-container
        *ngFor="let segmento of segmentarCoincidencias(rio.ubicacion)"
      >
        <mark *ngIf="segmento.coincide">
          {{ segmento.texto }}
        </mark>

        <ng-container *ngIf="!segmento.coincide">
          {{ segmento.texto }}
        </ng-container>
      </ng-container>
    </p>

    <ng-container
      *ngIf="obtenerCoincidenciaSecundaria(rio) as coincidencia"
    >
      <div>
        <strong>{{ coincidencia.etiqueta }}:</strong>

        <ng-container
          *ngFor="
            let segmento of segmentarCoincidencias(
              coincidencia.texto
            )
          "
        >
          <mark *ngIf="segmento.coincide">
            {{ segmento.texto }}
          </mark>

          <ng-container *ngIf="!segmento.coincide">
            {{ segmento.texto }}
          </ng-container>
        </ng-container>
      </div>
    </ng-container>

    <a [routerLink]="['/public/rios', rio.id]">
      Ver información
    </a>
  </div>

  <div
    *ngIf="!cargando() && !error() && totalPages() > 1"
  >
    <button
      type="button"
      (click)="paginaAnterior()"
      [disabled]="page() <= 1"
    >
      Anterior
    </button>

    <span>
      Página {{ page() }} de {{ totalPages() }}
    </span>

    <button
      type="button"
      (click)="paginaSiguiente()"
      [disabled]="page() >= totalPages()"
    >
      Siguiente
    </button>
  </div>
</section>
