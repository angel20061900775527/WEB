<section>
  <h1>Museos</h1>

  <div *ngIf="cargando()">
    Cargando museos...
  </div>

  <div *ngIf="error()">
    {{ error() }}
  </div>

  <div *ngFor="let museo of museos()">
    <h2>{{ museo.nombre }}</h2>

    <p>{{ museo.ubicacion }}</p>

    <a [routerLink]="['/public/museos', museo.id]">
      Ver información
    </a>
  </div>
</section>
