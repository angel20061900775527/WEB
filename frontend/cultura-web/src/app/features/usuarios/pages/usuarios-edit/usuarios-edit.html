<section class="patrimonial-page">
  <div class="patrimonial-header">
    <div>
      <h1>Editar usuario</h1>

      <p>
        Actualiza la información y el rol del usuario seleccionado.
      </p>
    </div>
  </div>

  @if (error()) {
    <p>{{ error() }}</p>
  }

  <form
    [formGroup]="form"
    (ngSubmit)="guardar()"
    class="patrimonial-form"
  >
    <div class="patrimonial-form-grid">
      <label>
        <span>Usuario</span>

        <input
          type="text"
          formControlName="username"
          autocomplete="off"
        />

        @if (
          form.controls.username.touched &&
          form.controls.username.invalid
        ) {
          <small>
            El usuario es obligatorio.
          </small>
        }
      </label>

      <label>
        <span>Nombres</span>

        <input
          type="text"
          formControlName="nombres"
        />

        @if (
          form.controls.nombres.touched &&
          form.controls.nombres.invalid
        ) {
          <small>
            Los nombres son obligatorios.
          </small>
        }
      </label>

      <label>
        <span>Apellidos</span>

        <input
          type="text"
          formControlName="apellidos"
        />

        @if (
          form.controls.apellidos.touched &&
          form.controls.apellidos.invalid
        ) {
          <small>
            Los apellidos son obligatorios.
          </small>
        }
      </label>

      <label>
        <span>Correo electrónico</span>

        <input
          type="email"
          formControlName="email"
        />

        @if (
          form.controls.email.touched &&
          form.controls.email.invalid
        ) {
          <small>
            Ingresa un correo electrónico válido.
          </small>
        }
      </label>

      <label>
        <span>Rol</span>

        <select formControlName="rol">
          <option value="ADMINISTRADOR">
            Administrador
          </option>

          <option value="CULTURA">
            Cultura
          </option>

          <option value="CONSULTA">
            Consulta
          </option>
        </select>

        @if (esUsuarioActual()) {
          <small>
            No puede modificar el rol de su propia cuenta.
          </small>
        }
      </label>
    </div>

    <div class="patrimonial-form-actions">
      <button
        type="button"
        (click)="cancelar()"
        [disabled]="loading()"
      >
        Cancelar
      </button>

      <button
        type="submit"
        [disabled]="form.invalid || loading()"
      >
        @if (loading()) {
          Guardando...
        } @else {
          Guardar cambios
        }
      </button>
    </div>
  </form>
</section>
