template: `
  <section class="patrimonial-page">
    <div class="patrimonial-header">
      <div>
        <h1>Restablecer contraseña</h1>

        @if (usuario(); as usuarioActual) {
          <p>
            Usuario:
            <strong>{{ usuarioActual.username }}</strong>
          </p>
        }
      </div>
    </div>

    @if (error()) {
      <p>{{ error() }}</p>
    }

    @if (success()) {
      <p>{{ success() }}</p>
    }

    <form
      [formGroup]="form"
      (ngSubmit)="guardar()"
      class="patrimonial-form"
    >
      <div class="patrimonial-form-grid">
        <label>
          <span>Nueva contraseña</span>

          <input
            type="password"
            formControlName="password"
            autocomplete="new-password"
          />

          @if (
            form.controls.password.touched &&
            form.controls.password.invalid
          ) {
            <small>
              La contraseña debe tener al menos 8 caracteres.
            </small>
          }
        </label>

        <label>
          <span>Confirmar contraseña</span>

          <input
            type="password"
            formControlName="confirmarPassword"
            autocomplete="new-password"
          />

          @if (
            form.controls.confirmarPassword.touched &&
            form.controls.confirmarPassword.invalid
          ) {
            <small>
              Confirma la contraseña.
            </small>
          }
        </label>
      </div>

      <div class="patrimonial-form-actions">
        <button
          type="button"
          (click)="volver()"
          [disabled]="loading()"
        >
          Volver
        </button>

        <button
          type="submit"
          [disabled]="form.invalid || loading()"
        >
          @if (loading()) {
            Guardando...
          } @else {
            Restablecer contraseña
          }
        </button>
      </div>
    </form>
  </section>
`,
