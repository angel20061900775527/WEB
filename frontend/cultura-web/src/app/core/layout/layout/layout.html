<mat-sidenav-container class="app-container">
  <mat-sidenav
    class="sidebar"
    mode="side"
    [opened]="sidebarOpened()"
  >
    <app-sidebar></app-sidebar>
  </mat-sidenav>

  <mat-sidenav-content class="app-content">
    <mat-toolbar class="toolbar">
      <div class="toolbar__left">
        <button
          mat-icon-button
          type="button"
          class="toolbar__menu"
          matTooltip="Mostrar u ocultar menú"
          aria-label="Mostrar u ocultar menú"
          (click)="toggleSidebar()"
        >
          <mat-icon>menu</mat-icon>
        </button>

        <div class="toolbar__title">
          <span>Panel administrativo</span>

          <small>
            Gestión del Patrimonio Cultural
          </small>
        </div>
      </div>

      <span class="toolbar__spacer"></span>

      <div class="toolbar__right">
        <button
          mat-icon-button
          type="button"
          class="toolbar__action"
          matTooltip="Notificaciones"
          aria-label="Notificaciones"
        >
          <mat-icon>notifications_none</mat-icon>
        </button>

        @if (usuario(); as usuarioActual) {
          <div class="user-session">
            <div class="user-avatar">
              {{ obtenerIniciales() }}
            </div>

            <div class="user-information">
              <strong>
                {{ obtenerNombreCompleto() }}
              </strong>

              <small>
                {{ obtenerNombreRol() }}
              </small>
            </div>

            <button
              mat-icon-button
              type="button"
              class="user-session__logout"
              matTooltip="Cerrar sesión"
              aria-label="Cerrar sesión"
              (click)="cerrarSesion()"
            >
              <mat-icon>logout</mat-icon>
            </button>
          </div>
        }
      </div>
    </mat-toolbar>

    <main class="page-content">
      <router-outlet></router-outlet>
    </main>

    <footer class="footer">
      <span>
        SIGPAC · Sistema de Gestión del Patrimonio Cultural
      </span>

      <span>
        GAD Municipal de Zamora · 2026
      </span>
    </footer>
  </mat-sidenav-content>
</mat-sidenav-container>
